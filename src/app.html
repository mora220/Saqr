<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<title>صقر – إدارة الفصل</title>
<style>
/*FONTS*/
:root{
  --sky1:#1b2a4a; --sky2:#27407a; --sun:#ffc93c; --gold:#f5b301;
  --ink:#1f2a44; --muted:#6b7590; --card:#ffffff; --bg:#eef3fb;
  --pos:#22b573; --neg:#ff5d5d; --accent:#ff8a3d; --violet:#7b5cd6;
  --radius:22px; --shadow:0 10px 30px rgba(27,42,74,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0}
input,textarea,select{font-family:inherit;font-size:1rem}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--sky1),var(--sky2));color:#fff;
  padding:12px 16px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18);overflow:hidden}
.top .clouds{position:absolute;inset:0;pointer-events:none;opacity:.08}
.top-row{display:flex;align-items:center;gap:12px;position:relative}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{width:52px;height:52px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.brand h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:.5px;line-height:1}
.brand small{display:block;font-size:.8rem;opacity:.8;font-weight:500}
.spacer{flex:1}
.class-pick{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:16px;padding:4px 6px}
.class-pick select{background:transparent;color:#fff;border:0;font-weight:700;font-size:1.05rem;padding:6px 4px;max-width:150px}
.class-pick select option{color:#111}
.icon-btn{background:rgba(255,255,255,.15);color:#fff;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:1.2rem;transition:.2s}
.icon-btn:hover{background:rgba(255,255,255,.28)}
.stats{display:flex;gap:10px;margin-top:10px;position:relative;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border-radius:14px;padding:4px 12px;font-size:.9rem;display:flex;gap:6px;align-items:center}
.stat b{font-size:1.1rem;color:var(--sun)}

@media(max-width:520px){
  .top{padding:10px 12px 12px}.top-row{gap:6px}
  .brand .logo{width:42px;height:42px}.brand h1{font-size:1.55rem}.brand small{display:none}
  .class-pick select{max-width:108px;font-size:.98rem}.icon-btn{width:36px;height:36px;font-size:1.05rem;border-radius:12px}
  .stats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-12px;margin-right:-12px;padding:0 12px}.stats::-webkit-scrollbar{display:none}
  .stat{flex:0 0 auto}
}
/* ---------- tools ---------- */
.tools{display:flex;gap:10px;padding:14px 16px 4px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border-radius:18px;
  padding:10px 14px;min-width:84px;box-shadow:var(--shadow);font-weight:700;font-size:.9rem;color:var(--ink);transition:transform .15s}
.tool .ic{font-size:1.6rem;line-height:1.1}
.tool:active{transform:scale(.94)}
.tool.on{background:var(--violet);color:#fff}

/* ---------- grid ---------- */
main{padding:10px 16px 120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;align-items:start}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}.card .av{width:118px;height:118px}.card .nm{font-size:1.15rem}}
.card{position:relative;background:var(--card);border-radius:var(--radius);padding:10px 8px 12px;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .15s, box-shadow .15s;user-select:none}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(27,42,74,.18)}
.card.sel{outline:4px solid var(--violet);outline-offset:-4px}
.card .av{width:96px;height:96px;margin:0 auto;display:block}
.card .nm{font-weight:700;font-size:1.05rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .lv{font-size:.75rem;color:var(--muted);font-weight:600}
.pts{position:absolute;top:8px;left:8px;min-width:36px;height:36px;border-radius:12px;padding:0 6px;display:grid;place-items:center;
  font-weight:800;font-size:1.05rem;color:#fff;background:var(--pos);box-shadow:0 4px 10px rgba(34,181,115,.35)}
.pts.neg{background:var(--neg);box-shadow:0 4px 10px rgba(255,93,93,.35)}
.pts.zero{background:#c3c9d8;box-shadow:none}
.bar{height:7px;background:#e7ecf6;border-radius:9px;margin:6px 10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--accent));border-radius:9px;transition:width .6s}
.card.gold{background:linear-gradient(160deg,#fff8de,#fff)}
.card.gold::after{content:"";position:absolute;inset:0;border-radius:var(--radius);border:2px solid #f6d36b;pointer-events:none}
.card.add{display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px dashed #c9d3ea;background:transparent;box-shadow:none;color:var(--muted);min-height:170px}
.card.add .plus{font-size:2.6rem;line-height:1}
.card.whole{background:linear-gradient(160deg,#7b5cd6,#5a46b8);color:#fff}
.card.whole .lv{color:#e8e1ff}

/* falcon idle animation */
.fal .wl{transform-origin:40px 70px;animation:flapL 3.2s ease-in-out infinite}
.fal .wr{transform-origin:80px 70px;animation:flapR 3.2s ease-in-out infinite}
.fal .bod{animation:bob 3.2s ease-in-out infinite;transform-origin:60px 100px}
.fal .eyes{animation:blink 5s infinite;transform-origin:60px 58px}
@keyframes flapL{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(14deg)}92%{transform:rotate(-4deg)}}
@keyframes flapR{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(-14deg)}92%{transform:rotate(4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.card:nth-child(3n) .fal *{animation-delay:-1.1s}.card:nth-child(3n+1) .fal *{animation-delay:-2.2s}
.fal.flap .wl{animation:fastL .18s ease-in-out infinite}
.fal.flap .wr{animation:fastR .18s ease-in-out infinite}
@keyframes fastL{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(30deg)}}
@keyframes fastR{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-30deg)}}

/* ---------- bottom bar ---------- */
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:15;display:flex;justify-content:center;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(238,243,251,1) 60%,rgba(238,243,251,0))}
.pill{background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:12px 18px;font-weight:700;font-size:1rem;color:var(--ink);display:flex;gap:6px;align-items:center}
.pill.primary{background:linear-gradient(135deg,var(--accent),#ff6a3d);color:#fff}
.pill.violet{background:var(--violet);color:#fff}
.pill[hidden]{display:none}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(18,26,48,.55);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
@media(min-width:700px){.ov{align-items:center}}
.sheet{background:#fff;width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px 26px;position:relative}
@media(min-width:700px){.sheet{border-radius:28px}}
.sheet h2{margin:4px 0 10px;font-size:1.5rem;display:flex;align-items:center;gap:8px}
.x{position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:12px;background:#eef1f8;font-size:1.2rem;color:var(--muted)}
.who{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.who .av{width:90px;height:90px}
.who .info b{font-size:1.4rem;display:block}
.who .info span{color:var(--muted);font-weight:600}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;padding:10px;border-radius:14px;background:#eef1f8;font-weight:700;color:var(--muted)}
.tab.on.p{background:#ddf7ea;color:#14935b}
.tab.on.n{background:#ffe5e5;color:#d63e3e}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.skill{background:#f6f8fd;border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;color:var(--ink);transition:transform .12s}
.skill:active{transform:scale(.92)}
.skill .em{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;position:relative}
.skill .em::after{content:attr(data-v);direction:ltr;unicode-bidi:isolate;position:absolute;bottom:-4px;left:-4px;background:#fff;border-radius:10px;padding:0 6px;font-size:.8rem;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.skill.p .em{background:#ddf7ea}.skill.n .em{background:#ffe5e5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 16px;border-radius:14px;font-weight:700;background:#eef1f8;color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff}.btn.vio{background:var(--violet);color:#fff}.btn.red{background:#ffe5e5;color:#d63e3e}
.field{width:100%;padding:12px 14px;border-radius:14px;border:2px solid #e3e8f3;background:#fafbff;outline:none}
.field:focus{border-color:var(--violet)}
textarea.field{min-height:150px;resize:vertical;line-height:1.7}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dfe4ef}
.sw.on{box-shadow:0 0 0 3px var(--violet)}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin:8px 0}
.acc{background:#f6f8fd;border-radius:16px;padding:4px;border:3px solid transparent}
.acc.on{border-color:var(--violet)}
.acc svg{width:100%;height:auto;display:block}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:#f6f8fd;border-radius:16px;padding:6px 10px}
.li .av{width:46px;height:46px;flex:0 0 auto}
.li .rk{width:30px;text-align:center;font-weight:800;color:var(--muted)}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow small{color:var(--muted)}
.chip{padding:2px 10px;border-radius:10px;font-weight:800}
.chip.p{background:#ddf7ea;color:#14935b}.chip.n{background:#ffe5e5;color:#d63e3e}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 30%,#3a5aa8,#1b2a4a 70%);color:#fff;display:none;align-items:center;justify-content:center;padding:24px;overflow:hidden}
#login.show{display:flex}
.lclouds{position:absolute;inset:0;width:100%;height:100%}
.lbox{position:relative;text-align:center;width:min(420px,100%)}
#loginFal{width:200px;height:200px;margin:0 auto}
#login h1{font-size:3.6rem;margin:0;line-height:1.1;font-weight:800}
#login .tag{opacity:.85;font-size:1.1rem;margin:6px 0 24px;line-height:1.6}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f2a44;font-weight:800;font-size:1.1rem;padding:15px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lguest{margin-top:12px;background:transparent;color:#fff;opacity:.8;font-weight:600;font-size:1rem;text-decoration:underline;padding:10px}
.lalt{display:flex;gap:10px;margin-top:10px}
.obtn{flex:1;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:1rem;padding:13px;border-radius:16px;border:1.5px solid rgba(255,255,255,.25)}
.lform{display:flex;flex-direction:column;gap:10px}
.lform[hidden],#pStep1[hidden],#pStep2[hidden],.lin[hidden]{display:none}
#pStep1,#pStep2{display:flex;flex-direction:column;gap:10px}
.lin{width:100%;padding:14px 16px;border-radius:16px;border:0;font-size:1.05rem;background:#fff;color:#1f2a44;outline:3px solid transparent}
.lin:focus{outline-color:#ffc93c}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:16px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:12px;background:transparent;color:#fff;font-weight:700;font-size:1rem}
.seg button.on{background:#fff;color:#1f2a44}
.lrow{display:flex;justify-content:space-between}
.lbusy{font-size:1.2rem;font-weight:700;padding:18px}
.lmsg{color:#ffd0d0;min-height:1.4em}
/* ---------- attendance ---------- */
.tool{position:relative}.tool .dot{position:absolute;top:8px;left:10px;width:11px;height:11px;border-radius:50%;background:#ff5d5d;box-shadow:0 0 0 3px #fff}
.tool .dot[hidden]{display:none}
.card.out{opacity:.45;filter:grayscale(.6)}
.attb{position:absolute;top:8px;right:8px;font-size:.72rem;font-weight:800;color:#fff;border-radius:10px;padding:2px 7px}
.dnav{display:flex;align-items:center;gap:8px;justify-content:space-between;background:#f6f8fd;border-radius:18px;padding:6px}
.dnav .dt{text-align:center;flex:1}.dnav .dt b{display:block;font-size:1.15rem}.dnav .dt small{color:var(--muted);font-weight:600}
.dnav button{width:44px;height:44px;border-radius:14px;background:#fff;font-size:1.3rem;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.asum{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.asum span{border-radius:12px;padding:4px 10px;font-weight:800;color:#fff;font-size:.95rem}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.at{background:#f6f8fd;border-radius:18px;padding:6px 4px 8px;text-align:center;border:3px solid transparent;transition:transform .1s}
.at:active{transform:scale(.94)}
.at .av{width:58px;height:58px;margin:0 auto}
.at b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at .s{display:inline-block;margin-top:3px;border-radius:10px;padding:1px 8px;font-size:.8rem;font-weight:800;color:#fff}
.legend{color:var(--muted);font-size:.85rem;margin:8px 0 4px}
table.rep{width:100%;border-collapse:collapse;font-size:.95rem}
table.rep th,table.rep td{padding:8px 6px;border-bottom:1px solid #eef1f8;text-align:center}
table.rep th{color:var(--muted);font-weight:700}table.rep td:first-child,table.rep th:first-child{text-align:right}
/* ---------- fx ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.float{direction:ltr;position:fixed;font-weight:800;font-size:2.2rem;z-index:90;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:#fff;padding:10px 14px 10px 10px;border-radius:16px;
  z-index:95;display:flex;gap:12px;align-items:center;font-weight:600;transition:.3s;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast button{background:rgba(255,255,255,.15);color:var(--sun);padding:6px 12px;border-radius:10px;font-weight:800}
.flyer{position:fixed;width:120px;height:120px;z-index:85;pointer-events:none;left:0;top:0}
.spot{text-align:center;padding:10px 0}
.spot .av{width:200px;height:200px;margin:0 auto}
.spot .big{font-size:2.6rem;font-weight:800;margin:4px 0}
.levelup{text-align:center}
.levelup .av{width:220px;height:220px;margin:0 auto}
.levelup .big{font-size:2.2rem;font-weight:800;color:var(--gold)}

/* timer */
.timer{text-align:center}
.ring{position:relative;width:260px;height:260px;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:3.6rem;font-weight:800;direction:ltr}
.ring .fa{position:absolute;width:90px;height:90px;left:50%;bottom:14px;transform:translateX(-50%)}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.presets .btn{min-width:64px}
/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:10px}
.grp{background:#f6f8fd;border-radius:18px;padding:10px}
.grp h3{margin:0 0 6px;font-size:1.1rem}
.grp .m{display:flex;align-items:center;gap:6px;font-weight:600;padding:2px 0}
.grp .m .av{width:34px;height:34px}
/* noise */
.meter{height:34px;border-radius:18px;background:#eef1f8;overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;width:0;border-radius:18px;transition:width .1s,background .3s}
.noise-face{width:200px;height:200px;margin:0 auto;display:block}
.noise-label{text-align:center;font-size:1.8rem;font-weight:800}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty .av{width:160px;height:160px;margin:0 auto}
</style>
</head>
<body>

<header class="top">
  <svg class="clouds" viewBox="0 0 400 120" preserveAspectRatio="none"><g fill="#fff"><ellipse cx="60" cy="100" rx="70" ry="22"/><ellipse cx="110" cy="92" rx="40" ry="20"/><ellipse cx="320" cy="20" rx="60" ry="16"/><ellipse cx="360" cy="28" rx="40" ry="14"/></g></svg>
  <div class="top-row">
    <div class="brand"><div class="logo" id="logo"></div><div><h1>صقر</h1><small>حلّق بطلابك</small></div></div>
    <div class="spacer"></div>
    <div class="class-pick"><select id="classSel" aria-label="الفصل"></select><button class="icon-btn" id="classMenu" title="إدارة الفصول">⚙️</button></div>
    <button class="icon-btn" id="soundBtn" title="الصوت">🔊</button>
    <button class="icon-btn" id="acctBtn" title="حساب">👤</button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="tools">
  <button class="tool" data-tool="att" id="attTool"><span class="ic">📋</span>الحضور<i class="dot" hidden></i></button>
  <button class="tool" data-tool="random"><span class="ic">🎯</span>اختيار عشوائي</button>
  <button class="tool" data-tool="timer"><span class="ic">⏱️</span>المؤقت</button>
  <button class="tool" data-tool="groups"><span class="ic">🪶</span>الأسراب</button>
  <button class="tool" data-tool="noise"><span class="ic">🤫</span>مقياس الهدوء</button>
  <button class="tool" data-tool="report"><span class="ic">🏆</span>الترتيب والتقرير</button>
  <button class="tool" data-tool="select" id="selTool"><span class="ic">☑️</span>تحديد عدة طلاب</button>
</div>

<main><div class="grid" id="grid"></div></main>

<div class="bottom">
  <button class="pill violet" id="awardSel" hidden>⭐ نقاط للمحددين (<span id="selCount">0</span>)</button>
  <button class="pill" id="cancelSel" hidden>إلغاء التحديد</button>
  <button class="pill primary" id="addStudentsBtn">➕ إضافة طلاب</button>
</div>

<div id="login">
  <svg class="lclouds" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><g fill="#fff" opacity=".1"><ellipse cx="60" cy="250" rx="90" ry="30"/><ellipse cx="130" cy="240" rx="50" ry="26"/><ellipse cx="330" cy="60" rx="80" ry="22"/><ellipse cx="380" cy="70" rx="50" ry="18"/></g></svg>
  <div class="lbox">
    <div id="loginFal"></div>
    <h1>صقر</h1><p class="tag">إدارة الفصل بروح الصقور 🦅<br>نقاط، مستويات، ومتابعة لكل طالب</p>

<script>
"use strict";
/* =========================================================

/* ---------- storage ---------- */
const KEY = "saqr.v1";
const store = {
  load(){ try{ return JSON.parse(localStorage.getItem(KEY)) }catch(e){ return null } },

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);

/* ---------- falcon art ---------- */
const BODY = ["#9a6235","#5b6b8c","#2e9c9a","#7b5cd6","#e8833a","#e0609a","#3fa864","#3d8be0","#d9534f","#46505f"];
const ACCS = ["none","cap","glasses","bow","grad","headband","shemagh","star","headphones"];
const ACC_NAMES = {none:"بدون",cap:"كاب",glasses:"نظارة",bow:"فيونكة",grad:"قبعة تخرج",headband:"عصابة",shemagh:"شماغ",star:"نجمة",headphones:"سماعة"};

function shade(hex, amt){
  let c = hex.replace("#",""); if(c.length===3) c=c.split("").map(x=>x+x).join("");
  const n = parseInt(c,16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f = v => Math.max(0,Math.min(255, Math.round(amt<0 ? v*(1+amt) : v+(255-v)*amt)));
  return "#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
let gradN = 0;
function falconSVG(opt = {}){
  const level = opt.level ?? 1;            // 0 chick, 1 falcon, 2 golden
  const mood  = opt.mood || "idle";         // idle | happy | sad | alarm
  let body = opt.body || BODY[0];
  const acc = opt.acc || "none";
  const id = "g" + (++gradN);
  if(level===2) body = "#f2b01e";
  const dark = shade(body,-.35), light = shade(body,.35), belly = level===2 ? "#fff3c4" : "#fff5e6";
  const wing = shade(body,-.15);
  const s = level===0 ? .86 : 1;             // chick a bit smaller & rounder
  let eyes;
  if(mood==="happy"){
    eyes = `<path d="M38 59 Q46 49 54 59" stroke="#1f2a44" stroke-width="4.5" fill="none" stroke-linecap="round"/>
            <path d="M66 59 Q74 49 82 59" stroke="#1f2a44" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  } else {
    const py = mood==="sad" ? 2 : 0, pr = mood==="alarm" ? 4 : 6.2;
    eyes = `<g class="eyes">
      <circle cx="46" cy="57" r="12" fill="#fff" stroke="#ffcf3a" stroke-width="3"/>
      <circle cx="74" cy="57" r="12" fill="#fff" stroke="#ffcf3a" stroke-width="3"/>
      <circle cx="47.5" cy="${58+py}" r="${pr}" fill="#1f2a44"/><circle cx="72.5" cy="${58+py}" r="${pr}" fill="#1f2a44"/>
      <circle cx="49.5" cy="${55.5+py}" r="2.2" fill="#fff"/><circle cx="74.5" cy="${55.5+py}" r="2.2" fill="#fff"/></g>`;
    if(mood==="sad") eyes += `<path d="M36 44 L54 48 M84 44 L66 48" stroke="${dark}" stroke-width="4" stroke-linecap="round"/>`;
    if(mood==="alarm") eyes += `<path d="M37 42 L53 40 M83 42 L67 40" stroke="${dark}" stroke-width="4" stroke-linecap="round"/>`;
  }
  const mouth = mood==="happy" ? `<path d="M55 79 Q60 84 65 79" stroke="#c0392b" stroke-width="2.5" fill="#ff8f8f"/>` : "";
  const tuft = level===0
    ? `<path d="M52 26 Q50 14 58 20 Q60 10 64 20 Q72 14 68 27" fill="${light}"/>`
    : `<path d="M50 27 Q54 12 60 22 Q66 12 70 27" fill="${dark}"/>`;
  // peregrine "moustache" markings for adult
  const marks = level===0 ? "" :
    `<path d="M30 52 Q32 70 40 74 Q38 62 36 52Z" fill="${dark}" opacity=".85"/>
     <path d="M90 52 Q88 70 80 74 Q82 62 84 52Z" fill="${dark}" opacity=".85"/>`;
  const chevrons = level===0 ? "" :
    `<g stroke="${shade(body,-.2)}" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".55">
      <path d="M50 88 l4 3 l4 -3"/><path d="M62 88 l4 3 l4 -3"/><path d="M56 97 l4 3 l4 -3"/></g>`;
  const fluff = level===0 ? `<g fill="${light}"><circle cx="34" cy="80" r="5"/><circle cx="86" cy="80" r="5"/><circle cx="60" cy="104" r="5"/></g>` : "";
  const crown = level===2 ? `<g transform="translate(60 22)">
      <path d="M-18 4 L-14 -14 L-6 -4 L0 -18 L6 -4 L14 -14 L18 4Z" fill="#ffd84d" stroke="#d99a00" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="0" cy="-2" r="3" fill="#ff5d5d"/><circle cx="-10" cy="0" r="2" fill="#3d8be0"/><circle cx="10" cy="0" r="2" fill="#3fa864"/></g>` : "";
  const sparkle = level===2 ? `<g fill="#fff6b0"><path d="M14 30 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z"/><path d="M104 44 l1.6 4.4 l4.4 1.6 l-4.4 1.6 l-1.6 4.4 l-1.6 -4.4 l-4.4 -1.6 l4.4 -1.6z"/></g>` : "";
  return `<svg class="fal" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="صقر">
  <defs><radialGradient id="${id}" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="${light}"/><stop offset="1" stop-color="${body}"/></radialGradient></defs>
  <ellipse cx="60" cy="112" rx="28" ry="5" fill="#000" opacity=".08"/>
  ${sparkle}
  <g transform="translate(60 64) scale(${s}) translate(-60 -64)">
  <g class="wl"><path d="M30 62 Q6 70 10 96 Q22 92 32 86 Q26 98 30 104 Q40 92 42 80Z" fill="${wing}"/><path d="M14 92 Q22 88 30 84" stroke="${dark}" stroke-width="2" fill="none" opacity=".5"/></g>
  <g class="wr"><path d="M90 62 Q114 70 110 96 Q98 92 88 86 Q94 98 90 104 Q80 92 78 80Z" fill="${wing}"/><path d="M106 92 Q98 88 90 84" stroke="${dark}" stroke-width="2" fill="none" opacity=".5"/></g>
  <g class="bod">
    <g fill="#ffb400"><path d="M48 104 l-6 6 h8 l2-4 l2 4 h6z"/><path d="M66 104 l-2 6 h6 l2-4 l2 4 h8 l-6-6z"/></g>
    <path d="M60 22 C86 22 96 44 96 66 C96 92 80 106 60 106 C40 106 24 92 24 66 C24 44 34 22 60 22Z" fill="url(#${id})"/>
    ${tuft}
    <ellipse cx="60" cy="86" rx="22" ry="19" fill="${belly}"/>
    ${chevrons}${marks}${fluff}
    ${eyes}
    <path d="M51 66 Q60 60 69 66 Q68 75 60 83 Q55 76 51 66Z" fill="#ffcf3a" stroke="#e0a400" stroke-width="1.5"/>
    <path d="M60 83 Q63 79 64 74 Q60 78 57 77Z" fill="#3a3a3a"/>
    ${mouth}
    ${accSVG(acc, body)}
    ${crown}
  </g></g></svg>`;
}
function accSVG(a, body){
  switch(a){
    case "cap": return `<path d="M34 40 Q36 18 60 18 Q84 18 86 40Z" fill="#ff5d5d"/><path d="M80 38 Q100 36 104 44 Q90 46 80 42Z" fill="#d63e3e"/><circle cx="60" cy="19" r="3" fill="#fff"/>`;
    case "glasses": return `<g fill="none" stroke="#1f2a44" stroke-width="3.5"><rect x="32" y="46" width="28" height="22" rx="9"/><rect x="60" y="46" width="28" height="22" rx="9"/></g><path d="M58 52 h4" stroke="#1f2a44" stroke-width="3.5"/>`;
    case "bow": return `<g transform="translate(60 103)"><path d="M0 0 L-14 -8 L-14 8Z M0 0 L14 -8 L14 8Z" fill="#ff4f9a"/><circle r="4" fill="#d6307a"/></g>`;
    case "grad": return `<path d="M30 30 L60 18 L90 30 L60 42Z" fill="#1f2a44"/><rect x="48" y="34" width="24" height="8" fill="#1f2a44"/><path d="M88 31 v14" stroke="#ffc93c" stroke-width="2.5"/><circle cx="88" cy="47" r="3" fill="#ffc93c"/>`;
    case "headband": return `<path d="M27 46 Q60 30 93 46 L93 54 Q60 38 27 54Z" fill="#3d8be0"/><path d="M92 48 l10 -6 l-2 10 z" fill="#3d8be0"/>`;
    case "shemagh": return `<path d="M26 56 Q24 20 60 18 Q96 20 94 56 Q96 76 100 96 Q90 80 86 56 Q84 30 60 30 Q36 30 34 56 Q30 80 20 96 Q24 76 26 56Z" fill="#fff" stroke="#e2e2e2"/>
      <g fill="#e04848" opacity=".85"><circle cx="44" cy="26" r="1.6"/><circle cx="52" cy="23" r="1.6"/><circle cx="60" cy="22" r="1.6"/><circle cx="68" cy="23" r="1.6"/><circle cx="76" cy="26" r="1.6"/><circle cx="30" cy="60" r="1.6"/><circle cx="90" cy="60" r="1.6"/><circle cx="28" cy="72" r="1.6"/><circle cx="92" cy="72" r="1.6"/></g>
      <path d="M36 28 Q60 16 84 28" stroke="#1f2a44" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    case "star": return `<path d="M84 22 l4 9 l10 1 l-7.5 6.5 l2.3 9.7 l-8.8 -5.2 l-8.8 5.2 l2.3 -9.7 l-7.5 -6.5 l10 -1z" fill="#ffc93c" stroke="#e0a400" stroke-width="1.5"/>`;
    case "headphones": return `<path d="M28 58 Q28 20 60 20 Q92 20 92 58" stroke="#1f2a44" stroke-width="6" fill="none"/><rect x="20" y="52" width="14" height="22" rx="6" fill="#7b5cd6"/><rect x="86" y="52" width="14" height="22" rx="6" fill="#7b5cd6"/>`;
    default: return "";
  }
}

/* ---------- levels ---------- */
const LEVELS = [
  {min:0,  name:"فرخ صغير",  lv:0},
  {min:10, name:"صقر",       lv:1},
  {min:30, name:"صقر جارح",  lv:1},
  {min:60, name:"صقر ذهبي",  lv:2},
];
function levelOf(p){ let L=LEVELS[0],i=0; LEVELS.forEach((l,k)=>{ if(p>=l.min){L=l;i=k} }); const next=LEVELS[i+1];
  const prog = next ? (Math.max(0,p)-L.min)/(next.min-L.min) : 1; return {...L, idx:i, next, prog:Math.max(0,Math.min(1,prog))}; }

/* ---------- skills ---------- */
const POS = [
  {k:"part", t:"مشاركة", e:"🙋", v:1}, {k:"hw", t:"حلّ الواجب", e:"📘", v:1}, {k:"team", t:"تعاون", e:"🤝", v:1},
  {k:"crea", t:"إبداع", e:"💡", v:1}, {k:"calm", t:"هدوء", e:"😌", v:1}, {k:"help", t:"مساعدة زميل", e:"💪", v:1},
  {k:"excel", t:"إجابة مميزة", e:"🌟", v:2}, {k:"neat", t:"نظافة وترتيب", e:"✨", v:1},
];
const NEG = [
  {k:"noise", t:"إزعاج", e:"📢", v:-1}, {k:"nohw", t:"بدون واجب", e:"📕", v:-1}, {k:"late", t:"تأخير", e:"⏰", v:-1},
  {k:"focus", t:"عدم انتباه", e:"😴", v:-1}, {k:"phone", t:"جوال", e:"📱", v:-1}, {k:"rude", t:"عدم احترام", e:"🙅", v:-2},
];

/* ---------- state ---------- */
const MODE_KEY="saqr.mode", PREF_KEY="saqr.prefs";
const lsGet=k=>{ try{ return localStorage.getItem(k) }catch(e){ return null } }, lsSet=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v) }catch(e){} };
let MODE = lsGet(MODE_KEY);            // "guest" | "cloud" | null
let USER = null;
let S = {classes:[], cur:null, sound:true};
try{ Object.assign(S, JSON.parse(lsGet(PREF_KEY))||{}) }catch(e){}
function demo(){
  const names = ["عبدالله","محمد","فيصل","سلطان","عمر","يوسف","خالد","راكان","تركي","سعود","نواف","إبراهيم"];
  const students = names.map((n,i)=>({id:uid(),name:n,points:[3,5,1,8,0,12,2,4,6,1,9,3][i],pos:0,neg:0,look:{body:BODY[i%BODY.length],acc:ACCS[(i*5)%ACCS.length]}}));
  return {classes:[{id:uid(),name:"خامس أ (تجريبي)",demo:true,created:Date.now(),students,log:[]}], cur:null, sound:true};
}
function fixCur(){ if(!S.cur || !S.classes.find(c=>c.id===S.cur)) S.cur = S.classes[0] && S.classes[0].id; }
function save(){
  lsSet(PREF_KEY, JSON.stringify({cur:S.cur, sound:S.sound}));
  if(MODE==="cloud"){ if(window.Cloud) Cloud.sync(S.classes); }
  else store.save(S);
}
const cls = () => S.classes.find(c=>c.id===S.cur);
const stu = id => cls().students.find(s=>s.id===id);

/* ---------- sound (Web Audio synth, no files) ---------- */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)() }catch(e){} } if(AC && AC.state==="suspended") AC.resume(); return AC; }
function tone(freq, start, dur, type="sine", vol=.18){
  const a = ac(); if(!a || !S.sound) return;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(freq,a.currentTime+start);
  g.gain.setValueAtTime(0,a.currentTime+start); g.gain.linearRampToValueAtTime(vol,a.currentTime+start+.02);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+start+dur); o.connect(g).connect(a.destination); o.start(a.currentTime+start); o.stop(a.currentTime+start+dur+.05);
}
const SFX = {
  pos(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.25,"triangle",.16)); },
  neg(){ tone(330,0,.18,"square",.07); tone(247,.15,.3,"square",.07); },
  level(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.35,"triangle",.17)); },
  tick(){ tone(1200,0,.05,"square",.05); },
  pick(){ [784,988,1175,1568].forEach((f,i)=>tone(f,i*.09,.3,"sine",.2)); },
  whoosh(){ const a=ac(); if(!a||!S.sound) return; const len=a.sampleRate*.35, b=a.createBuffer(1,len,a.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len)*.5;
    const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); f.type="bandpass"; f.frequency.value=900; g.gain.value=.25; s.buffer=b; s.connect(f).connect(g).connect(a.destination); s.start(); },
  alarm(){ [880,660,880,660].forEach((f,i)=>tone(f,i*.18,.16,"sawtooth",.08)); },
  done(){ [659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.12,.4,"triangle",.18)); }
};

/* ---------- confetti ---------- */
const cv = document.getElementById("fx"), cx = cv.getContext("2d"); let parts=[], raf=null;
function sizeCv(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0) }
addEventListener("resize", sizeCv); sizeCv();
function confetti(x, y, n=60, colors=["#ffc93c","#ff8a3d","#22b573","#3d8be0","#7b5cd6","#ff5d9a"]){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=4+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,r:4+Math.random()*5,c:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:90+Math.random()*40,f:Math.random()<.35}); }
  if(!raf) loop();
}
function loop(){ cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.25; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha=Math.min(1,p.life/30); cx.fillStyle=p.c;
    if(p.f){ cx.beginPath(); cx.ellipse(0,0,p.r*1.6,p.r*.6,0,0,7); cx.fill(); } else cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); cx.restore(); });
  parts = parts.filter(p=>p.life>0 && p.y<innerHeight+40);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,innerWidth,innerHeight), null);
}
function feathers(x,y,color){ confetti(x,y,18,[color,shade(color,.3),"#fff5e6"]) }
function floatText(x,y,txt,color){ const el=document.createElement("div"); el.className="float"; el.textContent=txt; el.style.color=color; el.style.left=(x-30)+"px"; el.style.top=(y-30)+"px"; document.body.appendChild(el);
  gsap.fromTo(el,{y:0,scale:.4,opacity:0},{y:-90,scale:1.3,opacity:1,duration:.5,ease:"back.out(2)"}); gsap.to(el,{opacity:0,y:-140,delay:.75,duration:.5,onComplete:()=>el.remove()}); }

/* ---------- render ---------- */
const $ = s => document.querySelector(s);
const sgn = v => "\u2066"+(v>0?"+":"")+v+"\u2069";
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let selMode=false, selected=new Set();

function avatar(s, mood){ const L=levelOf(s.points); return falconSVG({level:L.lv, body:s.look.body, acc:s.look.acc, mood}); }

function renderClasses(){

}
function renderStats(){
  const c=cls(), total=c.students.reduce((a,s)=>a+s.points,0);
  const today=new Date().toDateString(), todayN=c.log.filter(l=>new Date(l.t).toDateString()===today&&l.v>0).reduce((a,l)=>a+l.v,0);

/* ---------- awarding ---------- */
function award(ids, skill){
  const c=cls(), t=Date.now(), before={}, leveled=[];
  ids.forEach(id=>{ const s=stu(id); if(!s) return; before[id]=levelOf(s.points).idx;
    s.points+=skill.v; skill.v>0 ? s.pos++ : s.neg++; c.log.push({sid:id,k:skill.k,v:skill.v,t});
    if(levelOf(s.points).idx>before[id]) leveled.push(id); });
  if(c.log.length>2000) c.log=c.log.slice(-2000);
  save();
  ids.forEach(id=>{ refreshCard(id); animateCard(id, skill); });
  skill.v>0 ? SFX.pos() : SFX.neg();
  const label = ids.length===1 ? stu(ids[0]).name : `${ids.length} طلاب`;
  toast(`${skill.e} ${sgn(skill.v)} ${skill.t} — ${label}`, ()=>{
    ids.forEach(id=>{ const s=stu(id); if(!s) return; s.points-=skill.v; skill.v>0 ? s.pos-- : s.neg--; });
    c.log = c.log.filter(l=>!(l.t===t && l.k===skill.k)); save(); ids.forEach(refreshCard); });
  if(leveled.length) setTimeout(()=>levelUp(leveled[0]), 900);
}
function animateCard(id, skill){
  const el=document.querySelector(`.card[data-id="${id}"]`); if(!el) return; const r=el.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/3;
  const s=stu(id); const av=el.querySelector(".av");
  if(skill.v>0){
    av.innerHTML = avatar(s,"happy"); av.querySelector(".fal").classList.add("flap");
    gsap.fromTo(av,{y:0},{y:-26,duration:.25,yoyo:true,repeat:3,ease:"power2.out",onComplete:()=>{ av.innerHTML=avatar(s) }});
    gsap.fromTo(el,{scale:1},{scale:1.08,duration:.18,yoyo:true,repeat:1});
    feathers(x,y,s.look.body); confetti(x,y,24); floatText(x,y,"+"+skill.v,"#22b573");
  } else {
    av.innerHTML = avatar(s,"sad");
    gsap.fromTo(el,{x:-8},{x:0,duration:.5,ease:"elastic.out(1,.3)",onComplete:()=>setTimeout(()=>{ if(av.isConnected) av.innerHTML=avatar(s) },700)});
    floatText(x,y,String(skill.v),"#ff5d5d");
  }
}

}

/* ---------- random picker: falcon flies over the class ---------- */
let lastPicked=null;
function randomPick(){
  const c=cls(); if(c.students.length<1) return;
  closeSheet();
  const here=c.students.filter(s=>!isOut(s.id)); if(!here.length){ toast("كل الطلاب غايبين النهارده 😅"); return; }
  let pool=here.filter(s=>s.id!==lastPicked); if(!pool.length) pool=here;
  const winner=pool[Math.floor(Math.random()*pool.length)]; lastPicked=winner.id;
  const cards=[...document.querySelectorAll(".card[data-id]")].filter(e=>e.dataset.id!=="__all");
  const winEl=document.querySelector(`.card[data-id="${winner.id}"]`);
  winEl.scrollIntoView({block:"center",behavior:"smooth"});
  const fly=document.createElement("div"); fly.className="flyer"; fly.innerHTML=falconSVG({level:1,body:"#9a6235"}); fly.querySelector(".fal").classList.add("flap"); document.body.appendChild(fly);
  const tl=gsap.timeline({delay:.35});
  gsap.set(fly,{x:innerWidth+60,y:innerHeight*.25,rotate:-10});
  const hops=Math.min(6,cards.length);
  for(let i=0;i<hops;i++){ const el=cards[Math.floor(Math.random()*cards.length)], r=el.getBoundingClientRect();
    tl.to(fly,{x:r.left+r.width/2-60,y:r.top-30,rotate:(i%2?12:-12),duration:.45,ease:"sine.inOut",onStart:SFX.whoosh}); }
  tl.add(()=>{},"+=0");
  tl.to(fly,{duration:.6,ease:"back.out(1.6)",rotate:0,
    x:()=>{ const r=winEl.getBoundingClientRect(); return r.left+r.width/2-60 }, y:()=>{ const r=winEl.getBoundingClientRect(); return r.top-50 } });
  tl.add(()=>{ SFX.pick(); const r=winEl.getBoundingClientRect(); confetti(r.left+r.width/2,r.top+40,90); gsap.fromTo(winEl,{scale:1},{scale:1.15,duration:.25,yoyo:true,repeat:1}); });
  tl.to(fly,{opacity:0,duration:.3,delay:.4,onComplete:()=>fly.remove()});
  tl.add(()=>{ openSheet(`<div class="spot"><div class="av" id="spAv">${avatar(winner,"happy")}</div><div class="big">${esc(winner.name)}</div><p class="hint">الصقر اختارك! 🦅</p>
    <div class="row" style="justify-content:center"><button class="btn pri" id="spGive">⭐ <bdi dir="ltr">+1</bdi> مشاركة</button><button class="btn vio" id="spAgain">🎯 اختيار تاني</button></div></div>`);
    $("#spAv .fal").classList.add("flap");
    $("#spGive").onclick=()=>{ closeSheet(); setTimeout(()=>award([winner.id],POS[0]),150) };
    $("#spAgain").onclick=()=>randomPick(); });
}

let tState={total:120,left:120,run:false,id:null};
function openTimer(){
  const C=2*Math.PI*112;
  openSheet(`<div class="timer"><h2 style="justify-content:center">⏱️ المؤقت</h2>
    <div class="ring"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="112" stroke="#eef1f8" stroke-width="18" fill="none"/><circle id="tArc" cx="130" cy="130" r="112" stroke="url(#tg)" stroke-width="18" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/>
      <defs><linearGradient id="tg"><stop offset="0" stop-color="#ffc93c"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs></svg>
      <div class="t" id="tTxt"></div></div>
    <div class="presets">${[1,2,3,5,10,15].map(m=>`<button class="btn" data-m="${m}">${m} د</button>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="tMinus">− 30 ث</button><button class="btn pri" id="tGo" style="min-width:120px"></button><button class="btn" id="tPlus">+ 30 ث</button><button class="btn" id="tReset">↺</button></div></div>`,
    ()=>{} );
  const upd=()=>{ const m=Math.floor(tState.left/60), s=tState.left%60; const t=$("#tTxt"); if(!t) return; t.textContent=`${m}:${String(s).padStart(2,"0")}`;
    $("#tArc").style.strokeDashoffset = C*(1-tState.left/Math.max(1,tState.total)); $("#tGo").textContent=tState.run?"⏸ إيقاف":"▶ ابدأ";
    t.style.color = tState.left<=10 && tState.run ? "#ff5d5d" : ""; };
  const stop=()=>{ clearInterval(tState.id); tState.run=false; upd(); };
  const tick=()=>{ tState.left--; if(tState.left<=5 && tState.left>0) SFX.tick();
    if(tState.left<=0){ tState.left=0; stop(); SFX.done(); confetti(innerWidth/2,innerHeight/2,120); toast("⏰ انتهى الوقت!"); } upd(); };
  $("#tGo").onclick=()=>{ if(tState.run){ stop(); return; } if(tState.left<=0) tState.left=tState.total; tState.run=true; ac(); tState.id=setInterval(tick,1000); upd(); };
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ stop(); tState.total=tState.left=+b.dataset.m*60; upd(); });
  $("#tPlus").onclick=()=>{ tState.left+=30; tState.total=Math.max(tState.total,tState.left); upd(); };
  $("#tMinus").onclick=()=>{ tState.left=Math.max(0,tState.left-30); upd(); };
  $("#tReset").onclick=()=>{ stop(); tState.left=tState.total; upd(); };
  upd();
}

/* ---------- noise meter ---------- */
let mic=null;
async function openNoise(){
  openSheet(`<h2>🤫 مقياس الهدوء</h2><div id="nFace"></div><div class="noise-label" id="nLbl">جاري تشغيل الميكروفون…</div>

  $("#nFace").innerHTML=`<div class="noise-face">${falconSVG({level:1,body:"#2e9c9a",mood:"happy"})}</div>`;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true}); const a=ac(); const src=a.createMediaStreamSource(stream), an=a.createAnalyser(); an.fftSize=512; src.connect(an);
    const data=new Uint8Array(an.fftSize); let mood="", lastAlarm=0, sm=0;
    mic={stream,raf:0};
    const step=()=>{ an.getByteTimeDomainData(data); let sum=0; for(const v of data){ const d=(v-128)/128; sum+=d*d } const rms=Math.sqrt(sum/data.length);
      const sens=+($("#nSens")?.value||5); sm=sm*.85+Math.min(1,rms*sens*6)*.15; const pct=Math.round(sm*100);
      const bar=$("#nBar"); if(!bar) return;
      bar.style.width=pct+"%"; const m= pct<35?"happy": pct<65?"idle":"alarm"; bar.style.background= m==="happy"?"#22b573": m==="idle"?"#ffc93c":"#ff5d5d";
      if(m!==mood){ mood=m; $("#nFace").innerHTML=`<div class="noise-face">${falconSVG({level:1,body:"#2e9c9a",mood:m})}</div>`; $("#nLbl").textContent= m==="happy"?"هادئ ممتاز 🌿": m==="idle"?"مقبول 🙂":"الصوت عالي! 📢"; }
      if(m==="alarm" && Date.now()-lastAlarm>4000){ lastAlarm=Date.now(); gsap.fromTo(".noise-face",{x:-10},{x:0,duration:.6,ease:"elastic.out(1,.3)"}); }
      mic.raf=requestAnimationFrame(step); };
    step();
  }catch(e){ $("#nLbl").textContent="لم يتم السماح بالميكروفون 🎙️"; }

const ATT={p:{t:"حاضر",e:"✅",c:"#22b573"},a:{t:"غائب",e:"❌",c:"#ff5d5d"},l:{t:"متأخر",e:"⏰",c:"#f0a020"},x:{t:"مستأذن",e:"📝",c:"#3d8be0"}};
const ORDER=["p","a","l","x"];
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey=()=>dkey(new Date());
const fromKey=k=>{ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
function attOf(c,day,sid){ const d=c&&c.att&&c.att[day]; return d ? (d.s[sid]||"p") : null; }
const isOut=sid=>{ const st=attOf(cls(),todayKey(),sid); return st==="a"||st==="x"; };
function fmtDay(k){ const d=fromKey(k); let g="",h="";
  try{ g=d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"}); }catch(e){ g=k; }
  try{ h=d.toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}); }catch(e){}
  return {g,h}; }

    const {g,h}=fmtDay(day), isToday=day===todayKey();
    openSheet(`<h2>📋 الحضور والغياب</h2>

    const ensure=()=>{ if(!c.att[day]) c.att[day]={s:{},t:Date.now()}; return c.att[day]; };

    $("#agrid").onclick=e=>{ const b=e.target.closest(".at"); if(!b) return; const r=ensure(), cur=r.s[b.dataset.id]||"p";

function attReport(month){

    r.pct = days.length ? Math.round(100*(days.length-r.a-r.x)/days.length) : 100; return r; }).sort((a,b)=>b.a-a.a||b.l-a.l);
  const [y,m]=month.split("-").map(Number); let mName=month; try{ mName=new Date(y,m-1,1).toLocaleDateString("ar-EG",{month:"long",year:"numeric"}); }catch(e){}

      :`<p class="hint" style="text-align:center;padding:20px">مفيش تحضير مسجّل في الشهر ده</p>`}`);
  gsap.killTweensOf("#sheet"); gsap.set("#sheet",{y:0,opacity:1});
  $("#backAtt").onclick=()=>openAttendance();
  $("#mPrev").onclick=()=>attReport(shift(-1)); $("#mNext").onclick=()=>attReport(shift(1));
  const matrix=()=>[["الطالب",...days.map(d=>d.slice(5)),"غياب","تأخير","استئذان","نسبة الحضور"]]
    .concat(c.students.map(s=>{ const r=rows.find(x=>x.s===s); return [s.name,...days.map(d=>ATT[attOf(c,d,s.id)].t),r.a,r.l,r.x,r.pct+"%"]; }));
  $("#aCsv").onclick=()=>{ const csv="\ufeff"+matrix().map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download=`حضور-${c.name}-${month}.csv`; a.click(); }catch(e){ toast("التنزيل غير متاح هنا — استخدم نسخ"); } };
  $("#aCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(matrix().map(r=>r.join("\t")).join("\n")); toast("📋 اتنسخ! الصقه في Excel"); }catch(e){ toast("النسخ غير متاح هنا"); } };
}

let gotFirst=false;
function startCloud(user){
  USER=user; MODE="cloud"; lsSet(MODE_KEY,"cloud"); busy("جاري تحميل فصولك…"); gotFirst=false;
  Cloud.listen((list, local)=>{
    list.sort((a,b)=>(a.created||0)-(b.created||0));
    if(!gotFirst){
      gotFirst=true;
      // bring over real (non-demo) classes from this device the first time
      const L=store.load(); const have=new Set(list.map(c=>c.id));
      const carry=(L&&L.classes||[]).filter(c=>!c.demo && !have.has(c.id) && !c.migrated);
      if(carry.length){ list=list.concat(carry); toast(`☁️ تم رفع ${carry.length} فصل من هذا الجهاز للسحابة`);
        L.classes.forEach(c=>{ if(carry.includes(c)) c.migrated=true }); store.save(L); }
      if(!list.length) list=[{id:uid(),name:"فصلي الأول",created:Date.now(),students:[],log:[]}];
      S.classes=list; fixCur(); save(); firstRender(); return;
    }
    if(local) return;                       // our own write: UI already up to date
    if($("#ov").classList.contains("show")) { S._pending=list; return; }  // don't yank data under an open sheet
    S.classes=list; fixCur(); render();
  }, err=>{ showLogin("تعذّر الوصول لقاعدة البيانات: "+(err.code||err.message)); });
}

let gTimer=null;
function doSignIn(){
  if(!window.Cloud){ showLogin("لحظة… خدمة الدخول لسه بتتحمّل، جرّب تاني بعد ثواني"); return; }
  let pr;
  try{ pr = window.Cloud.signIn(); }            // opened synchronously inside the tap
  catch(e){ showLogin(authMsg(e)); return; }
  showLogin(); busy("كمّل تسجيل الدخول في نافذة جوجل…");
  $("#loginBusy").insertAdjacentHTML("beforeend",`<div><button class="lguest" id="gCancel">إلغاء</button></div>`);
  $("#gCancel").onclick=()=>{ clearTimeout(gTimer); showLogin("لو نافذة جوجل مش بتفتح، جرّب الدخول بالإيميل"); };
  clearTimeout(gTimer);
  gTimer=setTimeout(()=>{ if(!USER) showLogin("الدخول بجوجل اتأخر. لو بتستخدم آيفون: الإعدادات ← Safari ← اقفل «حظر النوافذ المنبثقة»، أو ادخل بالإيميل"); },60000);
  pr.then(()=>{ clearTimeout(gTimer); busy("جاري الدخول…"); })
    .catch(e=>{ clearTimeout(gTimer);
      const m = e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request" ? ""
              : e.code==="auth/popup-blocked" ? "المتصفح منع نافذة جوجل. اسمح بالنوافذ المنبثقة، أو ادخل بالإيميل"
              : authMsg(e);
      showLogin(m); });
}

function normPhone(v){ v=v.replace(/[\s\-()]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  if(v.startsWith("00")) v="+"+v.slice(2);
  if(/^05\d{8}$/.test(v)) v="+966"+v.slice(1); else if(/^5\d{8}$/.test(v)) v="+966"+v;
  return v; }
$("#phoneForm").onsubmit=async e=>{ e.preventDefault(); ac(); const ph=normPhone($("#pNum").value);
  if(!/^\+\d{8,15}$/.test(ph)){ lmsg("اكتب رقم الجوال صح، مثلاً 0512345678"); return; }
  $("#pSend").disabled=true; lmsg("");
  try{ const C=await cloudReady; await C.phoneSend(ph,"recap"); $("#pStep1").hidden=true; $("#pStep2").hidden=false; lmsg("📩 بعتنا كود على "+ph,true); setTimeout(()=>$("#pCode").focus(),50); }
  catch(err){ lmsg(authMsg(err)); } finally{ $("#pSend").disabled=false; } };
$("#pVerify").onclick=async()=>{ const code=$("#pCode").value.trim(); if(code.length<6){ lmsg("الكود 6 أرقام"); return; }
  $("#pVerify").disabled=true;
  try{ await Cloud.phoneVerify(code); busy("جاري الدخول…"); }catch(err){ lmsg(authMsg(err)); } finally{ $("#pVerify").disabled=false; } };
document.querySelectorAll(".lback").forEach(b=>b.onclick=()=>{ lmsg(""); showPane("loginBtns"); });
$("#guestBtn").onclick=()=>{ ac(); startGuest(); };
$("#acctBtn").onclick=openAcct;
const _close=closeSheet; closeSheet=function(){ _close(); if(S._pending){ S.classes=S._pending; delete S._pending; fixCur(); render(); } };

// ---- start ----
if(MODE==="guest") startGuest();
else { showLogin(); if(MODE==="cloud") busy("جاري الدخول…"); }
cloudReady.then(C=>C.onAuth(u=>{ if(u){ if(!USER || USER.uid!==u.uid) startCloud(u); } else if(MODE!=="guest"){ USER=null; showLogin(); } }))
  .catch(()=>{ if(MODE!=="guest") showLogin("تعذّر تحميل خدمة السحابة. تأكد من الإنترنت، أو جرّب بدون حساب."); });
</script>
